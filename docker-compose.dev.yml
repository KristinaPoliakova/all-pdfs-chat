# Optional full-stack LOCAL dev in containers — a high-fidelity mirror of the
# production stack (docker-compose.prod.yml) for smoke-testing the containerized
# path (incl. nginx routing) before a release.
#
#   Run:   ./scripts/dev.sh --docker          (build + migrate + up; serves http://localhost:8080)
#   Stop:  ./scripts/dev.sh --docker --stop    (docker compose -f docker-compose.dev.yml down)
#
# Differences from prod (intentional, local-only):
#   - builds images from ./backend and ./frontend instead of pulling GHCR
#   - nginx is HTTP-only on :8080 (no TLS/certbot)
#   - config is inline (no /etc/all-pdfs-chat env files); separate project name + volumes
#   - tracing is ON (TRACING_ENABLED) and the MLflow UI is published to
#     127.0.0.1:5000 (prod keeps that port unpublished)
# This is NOT the daily inner loop — use `./scripts/dev.sh` (native, hot-reload) for that.
name: all-pdfs-chat-dev

x-backend-env: &backend-env
  APP_ENV: prod
  DATABASE_URL: postgresql+asyncpg://all_pdfs_chat:devpassword@postgres:5432/all_pdfs_chat
  STORAGE_BACKEND: local
  LOCAL_STORAGE_PATH: /var/lib/all-pdfs-chat/uploads
  CLASSIFICATION_ENABLED: "true"
  PARSING_ENABLED: "false"
  LOG_LEVEL: INFO
  TRACING_ENABLED: "true"
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: all_pdfs_chat
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: all_pdfs_chat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init/02-create-mlflow-db.sql:/docker-entrypoint-initdb.d/02-create-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U all_pdfs_chat -d all_pdfs_chat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

  api:
    build: ./backend
    environment:
      <<: *backend-env
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - uploads:/var/lib/all-pdfs-chat/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/var/lib/all-pdfs-chat/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BACKEND_URL: http://api:8000
    depends_on: [api]
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, frontend]
    networks: [appnet]

  mlflow:
    build:
      context: ./deploy/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://all_pdfs_chat:devpassword@postgres:5432/mlflow
      --artifacts-destination /mlflow-artifacts
    # Published to loopback (local-only deviation from prod) so the MLflow UI is
    # reachable during a mirror run; the api reaches it internally at http://mlflow:5000.
    # Host port defaults to 5001 to avoid the macOS AirPlay Receiver on 5000.
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5001}:5000"
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]

volumes:
  pgdata:
  uploads:
  mlflow_artifacts:

networks:
  appnet:
