<!-- @dsCard group="Type" viewport="700x150" name="Mono — IBM Plex Mono" subtitle="Citations, key caps, status, page refs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .chip { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: var(--r-pill); }
  .key { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--text-dim); border: 1px solid var(--border); padding: 3px 8px; border-radius: var(--r-sm); }
  .pill { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--accent); border: 1px solid var(--accent); padding: 4px 11px; border-radius: var(--r-pill); }
</style>
</head>
<body>
  <span class="chip">p. 12</span>
  <span class="chip">p. 13</span>
  <span class="chip">p. 27</span>
  <span class="key">⇧⏎</span>
  <span class="pill">parsing…</span>
</body>
</html>
