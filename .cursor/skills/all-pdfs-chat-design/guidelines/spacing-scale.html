<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px-based; exact values kept from the mocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); padding: 18px 22px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); width: 120px; flex: none; }
  .bar { height: 12px; background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
  <div class="row"><span class="tag">--space-2 · 8</span><div class="bar" style="width:8px;"></div></div>
  <div class="row"><span class="tag">--space-3 · 12</span><div class="bar" style="width:12px;"></div></div>
  <div class="row"><span class="tag">--space-4 · 16</span><div class="bar" style="width:16px;"></div></div>
  <div class="row"><span class="tag">--space-5 · 18 (grid gap)</span><div class="bar" style="width:18px;"></div></div>
  <div class="row"><span class="tag">--space-8 · 32 (gutter)</span><div class="bar" style="width:32px;"></div></div>
  <div class="row"><span class="tag">--space-16 · 80</span><div class="bar" style="width:80px;"></div></div>
</body>
</html>
