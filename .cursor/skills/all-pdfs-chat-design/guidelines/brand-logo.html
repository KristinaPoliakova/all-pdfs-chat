<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); padding: 18px 22px; display: flex; align-items: center; gap: 26px; }
  .mark { display: flex; align-items: center; gap: 11px; }
  .glyph { border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; }
  .word { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="mark"><span class="glyph" style="width:44px;height:44px;font-size:22px;">A</span><span class="word" style="font-size:20px;">All PDFs Chat</span></div>
  <div class="mark"><span class="glyph" style="width:30px;height:30px;font-size:15px;border-radius:9px;">A</span><span class="word" style="font-size:16px;">All PDFs Chat</span></div>
  <span class="glyph" style="width:26px;height:26px;font-size:13px;border-radius:8px;">A</span>
</body>
</html>
