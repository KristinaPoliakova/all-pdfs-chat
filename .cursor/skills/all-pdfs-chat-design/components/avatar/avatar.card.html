<!-- @dsCard group="Components" viewport="700x150" name="Avatar" subtitle="Brand monogram & user initials" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); padding: 22px; display: flex; gap: 18px; align-items: center; }
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-family: var(--font-display); font-weight: var(--fw-bold); }
  .brand { background: var(--accent); color: var(--accent-ink); }
  .user { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
</style>
</head>
<body>
  <span class="av brand" style="width:44px;height:44px;font-size:18px;">A</span>
  <span class="av brand" style="width:32px;height:32px;font-size:14px;">A</span>
  <span class="av user" style="width:32px;height:32px;font-size:13px;">JS</span>
  <span class="av user" style="width:32px;height:32px;"></span>
</body>
</html>
