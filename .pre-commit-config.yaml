# Install: cd backend && uv sync && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files  (from repo root)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff
        name: ruff check (backend)
        args: [--config, backend/pyproject.toml, --fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format (backend)
        args: [--config, backend/pyproject.toml]
        files: ^backend/.*\.py$
