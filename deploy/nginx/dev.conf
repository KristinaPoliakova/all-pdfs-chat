# Local full-stack dev (docker-compose.dev.yml): HTTP-only mirror of the
# production reverse proxy (deploy/nginx/conf.d/app.conf) without TLS.
# Exercises the same routing: /api/v1 -> api, everything else -> frontend.
server {
    listen 80;
    server_name _;

    # PDF uploads can be up to 100 MiB (MAX_UPLOAD_SIZE_BYTES)
    client_max_body_size 100m;

    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
