[project]
name = "all-pdfs-chat-backend"
version = "0.1.0"
description = "Backend for all-pdfs-chat — upload PDFs and ask questions about their content"
readme = "../README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
mypy_path = "."

[tool.coverage.run]
source = ["app"]

[tool.uv]
default-groups = ["dev"]
