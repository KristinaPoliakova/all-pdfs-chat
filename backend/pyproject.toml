[project]
name = "all-pdfs-chat-backend"
version = "0.1.0"
description = "Backend for all-pdfs-chat — upload PDFs and ask questions about their content"
readme = "../README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "aiosqlite>=0.21",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.24",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pdfplumber>=0.11.9",
    "pydantic-settings>=2.8",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
prod = [
    "aioodbc>=0.5",
]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/application/auth/**/*.py" = ["B008"]
"backend/app/api/**/*.py" = ["B008"]
"backend/app/application/auth/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
mypy_path = "."

[tool.coverage.run]
source = ["app"]

[tool.uv]
default-groups = ["dev", "prod"]
