services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: all_pdfs_chat
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: all_pdfs_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U all_pdfs_chat -d all_pdfs_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
