services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: all_pdfs_chat
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: all_pdfs_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U all_pdfs_chat -d all_pdfs_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    build:
      context: ./deploy/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://all_pdfs_chat:devpassword@postgres:5432/mlflow
      --artifacts-destination /mlflow-artifacts
    # Host port defaults to 5001 to avoid the macOS AirPlay Receiver on 5000.
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5001}:5000"
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_artifacts:
